; Process supervisor for the pins container. supervisord runs as root (PID 1)
; and starts every service under its own user. Program output goes to the
; container log. See docker/README.md.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:pinsctl

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; Grants the pins user access to USB devices of the vendors covered by the
; udev rules in the image, and keeps doing so for devices plugged in later.
[program:usb-permissions]
command=/usr/local/bin/pins-usb-permissions watch
user=root
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Virtual X display for PHD2 (wxWidgets GUI application). The display number
; comes from PINS_DISPLAY: with host networking the X socket's abstract name
; is shared with the host, so :0 would collide with a desktop session there.
[program:xvfb]
command=/usr/bin/Xvfb %(ENV_PINS_DISPLAY)s -screen 0 1280x800x24 -nolisten tcp
user=pins
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; pins core server (ports 4782, 1888/5000 through plugins, 7624 indiserver).
[program:pins]
command=/opt/pins/NINA
directory=/opt/pins
user=pins
environment=HOME="/home/pins",USER="pins",DOTNET_USE_POLLING_FILE_WATCHER="true",DOTNET_CLI_TELEMETRY_OPTOUT="1"
priority=20
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; PHD2 guiding (server API on port 4400). Start-up is controlled by
; PHD2_AUTOSTART and at runtime through pinsdaemon (systemctl shim). The
; launcher turns the stop signal into a clean PHD2 shutdown (settings flush).
[program:phd2]
command=/usr/local/bin/pins-phd2
directory=/home/pins
user=pins
environment=HOME="/home/pins",USER="pins",DISPLAY="%(ENV_PINS_DISPLAY)s"
priority=30
autostart=%(ENV_PHD2_AUTOSTART)s
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=false
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; pinsdaemon system management API (port 8000).
[program:pinsdaemon]
command=/opt/pinsdaemon/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/opt/pinsdaemon
user=sysupdate-api
environment=HOME="/opt/pinsdaemon",API_TOKEN="%(ENV_PINSDAEMON_API_TOKEN)s",STARTUP_PACKAGE_CHECK_ENABLED="false",STARTUP_WIFI_AUTOMANAGE_ENABLED="false",INDI_3RDPARTY_JSON_PATH="/home/pins/Documents/INDI/3rdparty.json",PINS_RIG_NAME_FILE="/home/pins/.config/pins-rig-name"
priority=40
autostart=%(ENV_PINSDAEMON_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
